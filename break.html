<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Time to breathe, Sis 🌸</title>
  <style>
    body {
      background-color: #FBF9F6;
      color: #4A4743;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      padding: 40px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
      box-sizing: border-box;
    }
    h1 { color: #606C5D; margin-bottom: 8px; font-size: 2rem; }
    p { font-size: 1.1rem; line-height: 1.6; color: #706C66; margin-bottom: 20px; }
    
    /* Interactive Pacing Circle */
    .visual-counter {
      width: 160px;
      height: 160px;
      background-color: #94A684;
      border-radius: 50%;
      margin: 30px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 8px 24px rgba(148, 166, 132, 0.2);
      display: none; 
      transition: transform 1s ease-in-out, background-color 1s ease-in-out;
      transform: scale(0.9);
    }
    .visual-counter.expand { transform: scale(1.25); background-color: #DCAE96; }
    .visual-counter.contract { transform: scale(0.85); background-color: #94A684; }
    .sub-text { font-size: 0.8rem; font-weight: normal; opacity: 0.8; margin-top: 4px; }

    /* FIXED: Always visible, guaranteed structural footprint */
    .demo-container {
      width: 100%;
      max-width: 280px;
      margin: 20px auto;
      min-height: 200px; /* Forces space to exist even before image loads */
      display: none;     /* Controlled strictly by JS now */
    }
    .demo-container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    button.close-btn {
      margin-top: 24px;
      padding: 12px 24px;
      background-color: #94A684;
      color: white;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    button.close-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="container">
    <h1 id="title">Take care Sis! 🌸</h1>
    <p id="instruction">Loading your cozy reminder...</p>
    
    <div id="counterBox" class="visual-counter">
      <span id="pacerText">Breathe</span>
      <span id="pacerSubText" class="sub-text"></span>
    </div>

    <div id="demoBox" class="demo-container">
      <img id="demoImg" src="" alt="Stretch Demonstration">
    </div>

    <button id="closeBtn" class="close-btn">Done, back to work</button>
  </div>

  <script src="break.js"></script>
</body>
</html>
